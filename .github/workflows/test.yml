name: test

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: pacman -Syu --noconfirm shellcheck
      - name: Check Bash syntax
        run: bash -n get-arch lib/*.sh modules/*.sh tests/*.sh tests/run
      - name: Run ShellCheck
        run: shellcheck get-arch lib/*.sh modules/*.sh tests/*.sh tests/run
      - name: Run tests
        run: ./tests/run
      - name: Exercise full check mode
        run: printf 'ciuser\nci-host\n' | ./get-arch --check
